<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17124a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="સનાતન શીખો">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>સનાતન ધર્મ શીખો</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Hind+Vadodara:wght@400;500;600&family=Hind:wght@400;500;600&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="bar"><span class="logo" id="logo">🕉️</span>
  <span style="display:flex;gap:8px"><button class="pill" id="install" style="display:none"></button><button class="pill" id="lang" aria-label="ભાષા / भाषा / Language">🌐 <span id="langlbl">ગુ</span></button></span></div>
<main class="wrap">
  <h1 class="hero" id="hero"></h1><p class="sub" id="sub"></p>
  <div class="tiles" id="tiles"></div>
</main>
<script src="data.bundle.js"></script>
<script src="data.sections.js"></script>
<script src="app.js"></script>
<script>
const TILES=[
 ['akshar-gu','learn.html?s=akshar-gu','અ','#','',20],
 ['akshar-hi','learn.html?s=akshar-hi','अ','#','',200],
 ['numbers','learn.html?s=numbers','1️⃣','','',140],
 ['deities','learn.html?s=deities','🕉️','','',280],
 ['avatars','learn.html?s=avatars','🐟','','',330],
 ['abcd','book.html','🔤','','',45],
];
const count=k=>k==='abcd'?26:(SEC[k]?SEC[k].items.length:0);
function draw(){
  $('#hero').textContent=t('title');$('#sub').textContent=t('sub');$('#logo').textContent='🕉️ '+t('home');
  $('#install').textContent=t('install');
  $('#tiles').innerHTML=TILES.map(([k,href,em,,,h])=>`<a class="tile" style="--h:${h}" href="${href}"><span class="em">${em}</span><b>${esc(t(k))}</b><small>${count(k)} ${k==='numbers'?'':'★'}</small></a>`).join('')
   +`<div class="tile soon" style="--h:100"><span class="chip">${esc(t('soon'))}</span><span class="em">🪷</span><b>${esc(t('sanskrit'))}</b><small>॥</small></div>`;
}
$('#lang').onclick=()=>{cycleLang();draw()};
$('#install').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('#install').style.display='none'};
setLang(lang);draw();
</script>
</body>
</html>
